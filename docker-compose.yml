version: '3.8'

services:
  mamaegotchi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamaegotchi_uncisal
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
